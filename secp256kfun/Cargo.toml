[package]
name = "secp256kfun"
version = "0.12.1"
authors = ["LLFourn <lloyd.fourn@gmail.com>"]
license = "0BSD"
homepage = "https://github.com/LLFourn/secp256kfun"
repository = "https://github.com/LLFourn/secp256kfun"
documentation = "https://docs.rs/secp256kfun"
description = "A mid-level secp256k1 library optimized for fun!"
edition = "2024"
rust-version = "1.85.0"
categories = ["cryptography", "cryptography::cryptocurrencies"]
readme = "README.md"
keywords = ["bitcoin", "secp256k1"]


[dependencies]
digest = { version = "0.10", default-features = false }
subtle = { package = "subtle-ng", version = "2", default-features = false }
rand_core = { version = "0.6", default-features = false }
secp256kfun_arithmetic_macros = { version = "0.2.0", path = "../arithmetic_macros" }

# optional
serde = { version = "1.0",  optional = true, default-features = false, features = ["derive"] }
proptest = { version = "1", optional = true }
bincode = { workspace = true, optional = true }

# NOTE: the optional `secp256k1` dependencies behind the `libsecp_compat_*` features
# are removed on this branch.
#
# Cargo puts optional dependencies into the resolve graph whether or not their feature
# is enabled, so merely declaring them makes `secp256kfun -> secp256k1` a permanent
# edge. For anyone whose `secp256k1` is itself implemented on top of `secp256kfun`
# that is a dependency cycle, and Cargo rejects it outright -- there is no way for a
# downstream crate to opt out.
#
# Upstream this would be better fixed by moving the conversions into a separate
# `secp256kfun-libsecp-compat` crate, which lets both directions coexist.


[dev-dependencies]
serde_json = "1"
rand = { version = "0.8" }
lazy_static = "1.4"
sha2 = "0.10"
# proptest 1.7 has a breaking change dep on new rand_core 🤦
proptest = "=1.6"
criterion = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["std"]
alloc = [
"serde?/alloc",
"digest/alloc",
"bincode?/alloc"
]
std = ["alloc", "subtle/std", "digest/std", "bincode?/std"]
serde = [
"dep:serde",
"bincode?/serde"
]


[[bench]]
name = "bench_ecmult"
harness = false

[[bench]]
name = "bench_point"
harness = false


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
